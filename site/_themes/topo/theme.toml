[theme]
inherit = "basic"
stylesheets = ["topo.css"]
sidebars = ["sidebar/about.html", "sidebar/subscribe.html", "sidebar/archive.html", "sidebar/walking.html", "sidebar/elsewhere.html"]
pygments_style = { default = "friendly" }

[options]
nosidebar = "false"
# "/" opens Read the Docs search (its hotkeys addon), so Sphinx must not grab it for its own box.
enable_search_shortcuts = "false"
