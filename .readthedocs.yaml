# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"

sphinx:
  builder: dirhtml
  configuration: site/conf.py

# Dependencies come from pyproject.toml, pinned in uv.lock.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

# Search: posts and pages, not the lists of them. Tag, topic, and year pages repeat post titles,
# so they crowded the top of results. Paths are files in the dirhtml output.
search:
  ranking:
    blog/20*: 2
  ignore:
    - search/index.html
    - 404/index.html
    - 404.html
    - genindex/index.html
    - blog/archive/*
