# Redirects for ericholscher.com, the single source of truth. Read the Docs serves them,
# and .github/workflows/sync-redirects.yml syncs this file to the project with
# readthedocs-cli whenever it changes on main. A redirect added in the Read the Docs
# dashboard and missing here is deleted on the next sync.
#
# "page" redirects only fire when the old URL 404s, so retire a page by deleting it.
